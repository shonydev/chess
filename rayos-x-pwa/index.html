<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1312">
<meta name="description" content="Entrena tácticas de ajedrez con Rayos X.">
<link rel="manifest" href="./manifest.webmanifest">
<title>Rayos X · Ajedrez</title>
<style>
:root{color-scheme:dark;--bg:#0c1312;--panel:#172321;--ink:#e7eeec;--muted:#9aaba7;--line:#344440;--light:#dce5e1;--dark:#789087;--accent:#35c4d6;--ok:#4cc592;--bad:#ef8a5e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}main{max-width:480px;margin:0 auto;padding:20px 0 32px}.top,.meta,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.top h1{font-size:22px;margin:0}.top b{color:var(--accent)}button{font:inherit;color:inherit;cursor:pointer}.count,.btn,.cell{border:1px solid var(--line);background:transparent;border-radius:12px;padding:10px 14px}.meta{margin:22px 0 10px;color:var(--muted);font-size:13px}.board{display:grid;grid-template-columns:repeat(8,1fr);aspect-ratio:1;width:100%;overflow:hidden;border-radius:8px;border:1px solid var(--line)}.sq{display:grid;place-items:center;position:relative;border:0;padding:0;min-width:0;aspect-ratio:1;font-size:clamp(24px,8vw,44px);line-height:1}.sq.l{background:var(--light)}.sq.d{background:var(--dark)}.sq.sel{box-shadow:inset 0 0 0 4px var(--accent)}.sq.target:after{content:"";position:absolute;width:22%;height:22%;border-radius:50%;background:#0c13127a}.piece.w{color:#fff;text-shadow:0 1px 2px #111,1px 0 #111,-1px 0 #111}.piece.b{color:#172321;text-shadow:0 1px 1px #fff7}.status{min-height:52px;display:flex;align-items:center;gap:10px}.status:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--muted);flex:none}.status.good{color:var(--ok)}.status.good:before{background:var(--ok)}.status.bad{color:var(--bad)}.status.bad:before{background:var(--bad)}.actions{margin:8px 0 16px}.btn{flex:1;min-height:46px}.primary{background:var(--accent);color:#06191c;border-color:var(--accent);font-weight:700}.result,.list{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}.result h2{font-size:16px;margin:0 0 6px}.muted{color:var(--muted);font-size:14px}.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.cell{aspect-ratio:1;padding:0}.cell.done{background:var(--ok);color:#071b13}.cell.current{outline:2px solid var(--accent)}[hidden]{display:none!important}
</style>
</head>
<body><main>
<header class="top"><h1>Rayos <b>X</b></h1><button id="menu" class="count" aria-expanded="false">Ejercicios <span id="progress">0/0</span></button></header>
<section id="puzzleView">
<div class="meta"><span id="number">CARGANDO</span><span id="chapter">MATE EN UNA JUGADA</span></div>
<div id="board" class="board" aria-label="Tablero de ajedrez"></div>
<div id="status" class="status" role="status" aria-live="polite">Cargando ejercicios…</div>
<div class="actions"><button id="hint" class="btn">Pista</button><button id="reset" class="btn">Reiniciar</button><button id="next" class="btn primary" hidden>Siguiente</button></div>
<div id="result" class="result" hidden><h2>¡Correcto!</h2><p id="solutionText"></p></div>
<p id="footer" class="muted">El progreso se guarda en este dispositivo.</p>
</section>
<section id="listView" class="list" hidden><h2 id="listTitle">Ejercicios</h2><p class="muted">Elegí un ejercicio para continuar.</p><div id="cells" class="cells"></div><button id="back" class="btn">Volver al tablero</button></section>
</main>
<script>
(()=>{'use strict';
const DATA_URL='./data/mate-en-una.json',KEY='rayosx-book-progress-v2';
const glyph={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
const $=id=>document.getElementById(id);
let puzzles=[],idx=0,board=[],initial=[],selected=null,done=false,hinted=false,progress={};
function readFen(fen){const b=Array(64).fill('');fen.split(' ')[0].split('/').forEach((row,r)=>{let f=0;for(const c of row){if(/[1-8]/.test(c))f+=Number(c);else b[r*8+f++]=c;}});return b}
function coord(i){return 'abcdefgh'[i%8]+(8-Math.floor(i/8))}
function index(s){return (8-Number(s[1]))*8+'abcdefgh'.indexOf(s[0])}
function puzzle(){return puzzles[idx]}
function savedDone(id){return progress[id]===true}
function updateProgress(){$('progress').textContent=puzzles.filter(p=>savedDone(p.id)).length+'/'+puzzles.length}
function status(kind,msg){$('status').className='status'+(kind?' '+kind:'');$('status').textContent=msg}
function loadPuzzle(i){idx=Math.max(0,Math.min(i,puzzles.length-1));const p=puzzle();initial=readFen(p.fen);board=initial.slice();selected=null;hinted=false;done=savedDone(p.id);$('number').textContent='EJERCICIO '+p.id;$('chapter').textContent=(p.chapter||'TÁCTICAS').toLocaleUpperCase('es');$('footer').textContent='Ejercicio '+p.id+' · Página impresa '+(p.bookPage??'—')+'. Progreso guardado en este dispositivo.';$('result').hidden=!done;$('solutionText').textContent=(p.solutionSan||[]).join(' ');$('next').hidden=!done||idx===puzzles.length-1;status(done?'good':'',done?'Ejercicio resuelto.':(p.sideToMove==='w'?'Juegan blancas.':'Juegan negras.')+' Encontrá la solución.');render();updateProgress()}
function render(){const el=$('board');el.innerHTML='';board.forEach((piece,i)=>{const b=document.createElement('button');b.type='button';b.className='sq '+((Math.floor(i/8)+i%8)%2?'d':'l')+(selected===i?' sel':'');b.setAttribute('aria-label',coord(i)+(piece?' '+piece:''));if(piece){const s=document.createElement('span');s.className='piece '+(piece===piece.toUpperCase()?'w':'b');s.textContent=glyph[piece];b.append(s)}if(hinted&&puzzle().solutionUci?.[0]&&(i===index(puzzle().solutionUci[0].slice(0,2))||i===index(puzzle().solutionUci[0].slice(2,4))))b.classList.add('target');b.addEventListener('click',()=>tap(i));el.append(b)})}
function tap(i){if(done)return;const p=puzzle(),piece=board[i],turn=p.sideToMove;if(selected===null){if(piece&&(turn==='w'?piece===piece.toUpperCase():piece===piece.toLowerCase())){selected=i;render()}return}const move=coord(selected)+coord(i);if(move===(p.solutionUci||[])[0]){board[i]=board[selected];board[selected]='';done=true;progress[p.id]=true;try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}render();$('result').hidden=false;$('solutionText').textContent=(p.solutionSan||[]).join(' ');$('next').hidden=idx===puzzles.length-1;status('good','¡Correcto! Solución encontrada.');updateProgress()}else if(piece&&(turn==='w'?piece===piece.toUpperCase():piece===piece.toLowerCase())){selected=i;render()}else{selected=null;render();status('bad','Ese no es el movimiento esperado. Probá otra vez.')}}
function hint(){const p=puzzle(),m=(p.solutionUci||[])[0];if(!m)return;hinted=true;render();status('', 'Pista: mové '+coord(index(m.slice(0,2)))+' a '+coord(index(m.slice(2,4)))+'.')}
function showList(show){$('listView').hidden=!show;$('puzzleView').hidden=show;$('menu').setAttribute('aria-expanded',String(show));if(show){$('cells').innerHTML='';puzzles.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='cell'+(savedDone(p.id)?' done':'')+(i===idx?' current':'');b.textContent=p.id+(savedDone(p.id)?' ✓':'');b.setAttribute('aria-label','Ejercicio '+p.id);b.addEventListener('click',()=>{loadPuzzle(i);showList(false)});$('cells').append(b)})}}
$('hint').addEventListener('click',hint);$('reset').addEventListener('click',()=>loadPuzzle(idx));$('next').addEventListener('click',()=>loadPuzzle(idx+1));$('menu').addEventListener('click',()=>showList($('listView').hidden));$('back').addEventListener('click',()=>showList(false));
async function start(){try{const response=await fetch(DATA_URL,{cache:'no-cache'});if(!response.ok)throw new Error('HTTP '+response.status);puzzles=await response.json();if(!Array.isArray(puzzles)||!puzzles.length)throw new Error('No hay ejercicios en el JSON');try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){progress={}}loadPuzzle(0)}catch(e){status('bad','No se pudieron cargar los ejercicios. Serví la carpeta por HTTPS o localhost y comprobá data/mate-en-una.json.');$('number').textContent='ERROR';}}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
start();
})();
</script></body></html>
