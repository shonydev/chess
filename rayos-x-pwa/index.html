<!doctype html>

<style>
:root{color-scheme:dark;--bg:#0b1115;--panel:#151f25;--panel2:#1c2a31;--ink:#edf5f4;--muted:#9aadb1;--line:#304149;--light:#e4e9e3;--dark:#729187;--accent:#57d5e5;--ok:#61d6a0;--bad:#ff9b78;--shadow:0 18px 45px #0005;--pw-f:#fbfcfb;--pw-s:#101615;--pw-d:#101615;--pb-f:#263532;--pb-s:#0b100f;--pb-d:#dfe8e5}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -15%,#1e3940 0,transparent 52%),var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,sans-serif;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}main{width:100%;max-width:1120px;margin:0 auto;padding:10px 0 24px}.top,.meta,.actions{display:flex;align-items:center;justify-content:space-between;gap:10px}.top{padding:2px 0 18px}.top h1{font-size:25px;letter-spacing:-.8px;margin:0;font-weight:850}.top b{color:var(--accent)}button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}.count,.btn,.cell{border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px 14px;transition:transform .15s,background .15s}.count{font-size:13px;font-weight:650}.count:active,.btn:active,.cell:active{transform:scale(.97)}#puzzleView{background:linear-gradient(160deg,#19272d,#111a1f 65%);border:1px solid #2a3b42;border-radius:16px;padding:clamp(4px,1vw,12px);box-shadow:var(--shadow)}.meta{margin:2px 0 13px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:1.1px}.meta span:first-child{color:var(--accent)}.board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));aspect-ratio:1;width:100%;max-width:min(100%, 88vh, 900px);margin:0 auto;overflow:hidden;border-radius:4px;border:1px solid #ffffff20;box-shadow:0 9px 24px #0004}.sq{display:grid;place-items:center;position:relative;border:0;padding:0;min-width:0;width:100%;aspect-ratio:1;font-size:clamp(24px,8vw,46px);line-height:1}.sq.l{background:var(--light)}.sq.d{background:var(--dark)}.sq.sel{box-shadow:inset 0 0 0 4px var(--accent)}.sq.target:after{content:"";position:absolute;width:22%;height:22%;border-radius:50%;background:#0c13127a}.pc{position:absolute;inset:0;width:100%;height:100%;padding:5%;fill:var(--pf);stroke:var(--ps);stroke-width:1.5;stroke-linejoin:round;pointer-events:none;filter:drop-shadow(0 1px 1px #0003)}.pc.w{--pf:var(--pw-f);--ps:var(--pw-s);--pd:var(--pw-d)}.pc.b{--pf:var(--pb-f);--ps:var(--pb-s);--pd:var(--pb-d)}.pc .d{fill:none;stroke:var(--pd);stroke-width:1.4}.pc .e{fill:var(--pd);stroke:none}.status{min-height:48px;display:flex;align-items:center;gap:10px;font-weight:550;font-size:14px}.status:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none;box-shadow:0 0 0 4px #9aadb11a}.status.good{color:var(--ok)}.status.good:before{background:var(--ok);box-shadow:0 0 0 4px #61d6a022}.status.bad{color:var(--bad)}.status.bad:before{background:var(--bad);box-shadow:0 0 0 4px #ff9b781c}.actions{margin:5px 0 0}.btn{flex:1;min-height:46px;font-size:14px;font-weight:650}.primary{background:var(--accent);color:#07191d;border-color:var(--accent);font-weight:800}.next-arrow{flex:0 0 54px;width:54px;padding:0;font-size:24px;line-height:1;border-radius:16px}.result,.list{border-top:1px solid var(--line);padding-top:16px;margin-top:18px}.result h2{font-size:16px;margin:0 0 6px}.muted{color:var(--muted);font-size:13px}.cells{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px 0}.cell{aspect-ratio:1;padding:0;font-size:13px;font-weight:700}.cell.done{background:#1d503e;color:#8cf0c0;border-color:#32775b}.cell.current{outline:2px solid var(--accent)}.modal-backdrop{position:fixed;inset:0;z-index:10;display:grid;place-items:center;padding:24px;background:#050b0ddd;backdrop-filter:blur(8px)}.modal{width:min(100%,360px);padding:28px 22px 22px;text-align:center;border:1px solid #3a5960;border-radius:26px;background:linear-gradient(150deg,#20383e,#121d22);box-shadow:0 25px 80px #0009;animation:pop .22s ease-out}.success-mark{width:64px;height:64px;display:grid;place-items:center;margin:0 auto 15px;border-radius:50%;background:#1d6048;color:#91f5c6;font-size:32px}.modal h2{font-size:24px;letter-spacing:-.5px;margin:0 0 8px}.modal p{color:var(--muted);margin:0 0 22px;font-size:14px}.modal .btn{width:100%;margin-top:9px}.modal .secondary{background:transparent}.modal[hidden],.modal-backdrop[hidden]{display:none!important}@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}[hidden]{display:none!important}@media(min-width:700px){body{padding-left:20px;padding-right:20px}main{max-width:1120px}.top h1{font-size:28px}#puzzleView{padding:10px}.board{max-width:min(100%,88vh,900px)}.meta,.status,.actions,.result,#footer{max-width:min(100%,88vh,900px);margin-left:auto;margin-right:auto}}@media(max-width:420px){body{padding-left:3px;padding-right:3px}main{padding-top:4px}#puzzleView{padding:3px;border-radius:8px}.meta{margin:2px 4px 6px}.board{width:100%;max-width:min(100%,88vh);border-radius:2px}.sq{font-size:clamp(20px,11vw,44px)}.status,.actions,.result,#footer{margin-left:4px;margin-right:4px}}
</style>
</head>
<body><svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<symbol id="pc-P" viewBox="0 0 45 45"><circle cx="22.5" cy="13.5" r="5.2"/><path d="M17.5 19.5H27.5C27.5 25 31 28 31.5 36H13.5C14 28 17.5 25 17.5 19.5Z"/><path d="M11.5 36H33.5V39.5H11.5Z"/></symbol>
<symbol id="pc-R" viewBox="0 0 45 45"><path d="M12 9.5H17.5V13.5H20.5V9.5H24.5V13.5H27.5V9.5H33V19H12Z"/><path d="M14.5 19H30.5L31.5 33H13.5Z"/><path d="M11 33H34V39.5H11Z"/><path class="d" d="M14.5 19H30.5"/></symbol>
<symbol id="pc-B" viewBox="0 0 45 45"><circle cx="22.5" cy="8" r="2.5"/><path d="M22.5 10.4C27.5 14.5 28.5 19.5 25.5 24H19.5C16.5 19.5 17.5 14.5 22.5 10.4Z"/><path d="M18 24H27C27 29 31 31 31.5 36H13.5C14 31 18 29 18 24Z"/><path d="M11 36H34V39.5H11Z"/><path class="d" d="M22.5 14.5L25.2 18.2"/></symbol>
<symbol id="pc-N" viewBox="0 0 45 45"><path d="M12 39.5L12.5 33C12.5 26 17 24 19.5 21C16 21.5 13.5 24 11.5 26.5C9.5 26 9.5 22.5 11.5 19.5C13 17 15.5 15 17 12.5L17.5 8.5L21 11C24 10 27 11 29.5 14.5C33.5 19.5 34 29 33 39.5Z"/><circle class="e" cx="18.2" cy="16.2" r="1.2"/></symbol>
<symbol id="pc-Q" viewBox="0 0 45 45"><circle cx="9.5" cy="11.5" r="2.4"/><circle cx="16" cy="8.5" r="2.4"/><circle cx="22.5" cy="7.5" r="2.4"/><circle cx="29" cy="8.5" r="2.4"/><circle cx="35.5" cy="11.5" r="2.4"/><path d="M9.5 13.5L14 28.5L16 11L19.5 27.5L22.5 9.5L25.5 27.5L29 11L31 28.5L35.5 13.5L33 35H12Z"/><path d="M11 35H34V39.5H11Z"/></symbol>
<symbol id="pc-K" viewBox="0 0 45 45"><path d="M21 3H24V6H27V9H24V13.5H21V9H18V6H21Z"/><path d="M22.5 13.5C14.5 13.5 11 20.5 14.5 27.5L12.5 35H32.5L30.5 27.5C34 20.5 30.5 13.5 22.5 13.5Z"/><path d="M11 35H34V39.5H11Z"/><path class="d" d="M16.5 28H28.5"/></symbol>
</defs></svg><main>
<header class="top"><h1>Chess</h1><button id="menu" class="count" aria-expanded="false">Ejercicios <span id="progress">0/0</span></button></header>
<section id="puzzleView">
<div class="meta"><span id="number">CARGANDO</span><span id="chapter">MATE EN UNA JUGADA</span></div>
<div id="board" class="board" aria-label="Tablero de ajedrez"></div>
<div id="status" class="status" role="status" aria-live="polite">Cargando ejercicios…</div>
<div class="actions"><button id="hint" class="btn">✦ Pista</button><button id="reset" class="btn">↺ Reiniciar</button><button id="next" class="btn primary next-arrow" aria-label="Siguiente ejercicio" title="Siguiente ejercicio" hidden>→</button></div>
<div id="result" class="result" hidden><h2>¡Correcto!</h2><p id="solutionText"></p></div>
<p id="footer" class="muted">El progreso se guarda en este dispositivo.</p>
</section>
<section id="listView" class="list" hidden><h2 id="listTitle">Ejercicios</h2><p class="muted">Elegí un ejercicio para continuar.</p><div id="cells" class="cells"></div><button id="back" class="btn">← Volver al tablero</button></section><div id="successModal" class="modal-backdrop" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="success-mark">✓</div><h2 id="modalTitle">¡Excelente!</h2><p id="modalText">Encontraste la solución.</p><button id="modalNext" class="btn primary">Siguiente ejercicio&nbsp; →</button><button id="modalStay" class="btn secondary">Quedarme en el tablero</button></div></div>
</main>
<script>
(()=>{'use strict';
const DATA_URL='./data/mate-en-una.json',KEY='rayosx-book-progress-v2';
const glyph={K:'♔',Q:'♕',R:'♖',B:'♗',N:'♘',P:'♙',k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
const $=id=>document.getElementById(id);
let puzzles=[],idx=0,board=[],initial=[],selected=null,done=false,hinted=false,progress={};
function readFen(fen){const b=Array(64).fill('');fen.split(' ')[0].split('/').forEach((row,r)=>{let f=0;for(const c of row){if(/[1-8]/.test(c))f+=Number(c);else b[r*8+f++]=c;}});return b}
function coord(i){return 'abcdefgh'[i%8]+(8-Math.floor(i/8))}
function index(s){return (8-Number(s[1]))*8+'abcdefgh'.indexOf(s[0])}
function puzzle(){return puzzles[idx]}
function savedDone(id){return progress[id]===true}
function updateProgress(){$('progress').textContent=puzzles.filter(p=>savedDone(p.id)).length+'/'+puzzles.length}
function status(kind,msg){$('status').className='status'+(kind?' '+kind:'');$('status').textContent=msg}
function loadPuzzle(i){$('successModal').hidden=true;idx=Math.max(0,Math.min(i,puzzles.length-1));const p=puzzle();initial=readFen(p.fen);board=initial.slice();selected=null;hinted=false;done=false;$('number').textContent='EJERCICIO '+p.id;$('chapter').textContent=(p.chapter||'TÁCTICAS').toLocaleUpperCase('es');$('footer').textContent='Ejercicio '+p.id+' · Página impresa '+(p.bookPage??'—')+'. Progreso guardado en este dispositivo.';$('result').hidden=!done;$('solutionText').textContent=(p.solutionSan||[]).join(' ');$('next').hidden=!done||idx===puzzles.length-1;status(done?'good':'',done?'Ejercicio resuelto.':(p.sideToMove==='w'?'Juegan blancas.':'Juegan negras.')+' Encontrá la solución.');render();updateProgress()}
function render(){const el=$('board');el.innerHTML='';board.forEach((piece,i)=>{const b=document.createElement('button');b.type='button';b.className='sq '+((Math.floor(i/8)+i%8)%2?'d':'l')+(selected===i?' sel':'');b.setAttribute('aria-label',coord(i)+(piece?' '+piece:''));if(piece){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox','0 0 45 45');svg.setAttribute('aria-hidden','true');svg.classList.add('pc',piece===piece.toUpperCase()?'w':'b');const use=document.createElementNS('http://www.w3.org/2000/svg','use');use.setAttribute('href','#pc-'+piece.toUpperCase());use.setAttribute('width','45');use.setAttribute('height','45');svg.append(use);b.append(svg)}if(hinted&&puzzle().solutionUci?.[0]&&(i===index(puzzle().solutionUci[0].slice(0,2))||i===index(puzzle().solutionUci[0].slice(2,4))))b.classList.add('target');b.addEventListener('click',()=>tap(i));el.append(b)})}
function tap(i){if(done)return;const p=puzzle(),piece=board[i],turn=p.sideToMove;if(selected===null){if(piece&&(turn==='w'?piece===piece.toUpperCase():piece===piece.toLowerCase())){selected=i;render()}return}const move=coord(selected)+coord(i);if(move===(p.solutionUci||[])[0]){board[i]=board[selected];board[selected]='';done=true;progress[p.id]=true;try{localStorage.setItem(KEY,JSON.stringify(progress))}catch(e){}render();$('result').hidden=false;$('solutionText').textContent=(p.solutionSan||[]).join(' ');$('next').hidden=idx===puzzles.length-1;status('good','¡Correcto! Solución encontrada.');$('modalText').textContent=idx===puzzles.length-1?'Resolviste este ejercicio. Pronto habrá más desafíos.':'Resolviste el ejercicio '+p.id+'. ¿Vamos con el siguiente?';$('modalNext').hidden=idx===puzzles.length-1;$('modalStay').textContent=idx===puzzles.length-1?'Volver al tablero':'Quedarme en el tablero';$('successModal').hidden=false;updateProgress()}else if(piece&&(turn==='w'?piece===piece.toUpperCase():piece===piece.toLowerCase())){selected=i;render()}else{selected=null;render();status('bad','Ese no es el movimiento esperado. Probá otra vez.')}}
function hint(){const p=puzzle(),m=(p.solutionUci||[])[0];if(!m)return;hinted=true;render();status('', 'Pista: mové '+coord(index(m.slice(0,2)))+' a '+coord(index(m.slice(2,4)))+'.')}
function showList(show){$('listView').hidden=!show;$('puzzleView').hidden=show;$('menu').setAttribute('aria-expanded',String(show));if(show){$('cells').innerHTML='';puzzles.forEach((p,i)=>{const b=document.createElement('button');b.type='button';b.className='cell'+(savedDone(p.id)?' done':'')+(i===idx?' current':'');b.textContent=p.id+(savedDone(p.id)?' ✓':'');b.setAttribute('aria-label','Ejercicio '+p.id);b.addEventListener('click',()=>{loadPuzzle(i);showList(false)});$('cells').append(b)})}}
$('hint').addEventListener('click',hint);$('reset').addEventListener('click',()=>loadPuzzle(idx));$('next').addEventListener('click',()=>loadPuzzle(idx+1));$('modalNext').addEventListener('click',()=>loadPuzzle(idx+1));$('modalStay').addEventListener('click',()=>{$('successModal').hidden=true});$('successModal').addEventListener('click',e=>{if(e.target===$('successModal'))$('successModal').hidden=true});$('menu').addEventListener('click',()=>showList($('listView').hidden));$('back').addEventListener('click',()=>showList(false));
async function start(){try{const response=await fetch(DATA_URL,{cache:'no-cache'});if(!response.ok)throw new Error('HTTP '+response.status);puzzles=await response.json();if(!Array.isArray(puzzles)||!puzzles.length)throw new Error('No hay ejercicios en el JSON');try{progress=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){progress={}}loadPuzzle(0)}catch(e){status('bad','No se pudieron cargar los ejercicios. Serví la carpeta por HTTPS o localhost y comprobá data/mate-en-una.json.');$('number').textContent='ERROR';}}
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
start();
})();
</script></body></html>
