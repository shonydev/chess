name: Chess checks

on:
  push:
    paths:
      - "app/**"
      - "scripts/check-chess.mjs"
      - ".github/workflows/chess-check.yml"
  pull_request:
    paths:
      - "app/**"
      - "scripts/check-chess.mjs"
      - ".github/workflows/chess-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate app script and puzzle data
        run: node scripts/check-chess.mjs
