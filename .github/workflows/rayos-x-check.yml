name: Rayos X PWA checks

on:
  push:
    paths:
      - "rayos-x-pwa/**"
      - ".github/workflows/rayos-x-check.yml"
  pull_request:
    paths:
      - "rayos-x-pwa/**"
      - ".github/workflows/rayos-x-check.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate app script and puzzle data
        run: node scripts/check-rayos-x.mjs
